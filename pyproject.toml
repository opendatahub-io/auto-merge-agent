[project]
name = "auto-merge-agent"
version = "0.1.0"
description = "Policy-driven GitHub agent for low-risk pull request merges"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain>=1,<1.4.4",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "mlflow>=3,<4",
  "pydantic>=2,<3",
  "PyJWT[crypto]>=2.9,<3",
  "PyYAML>=6,<7",
  "unidiff>=0.7,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.22,<1"]
deployment = ["kubernetes>=31,<38"]

[project.scripts]
auto-merge-agent = "auto_merge_agent.cli:main"

[project.entry-points."auto_merge_agent.forges"]
github = "auto_merge_agent.github:GitHubForge"

[project.entry-points."auto_merge_agent.reviewers"]
coderabbit = "auto_merge_agent.reviews:CodeRabbitReviewer"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
