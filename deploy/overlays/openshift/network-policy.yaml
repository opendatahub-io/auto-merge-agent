# The Route fronts /webhook; without this policy any pod in the cluster could
# reach every path on port 8000 directly. Ingress is limited to the router
# namespaces via the label OpenShift sets on them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auto-merge-agent-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auto-merge-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8000
