schema_version: 1
# Replace the check names and review contacts, then enable the repo.
enabled: false
ci:
  expected:
    - name: unit-tests
      source: github-actions
  ignore:
    - name: tide
    - name: CodeRabbit
      source: coderabbitai[bot]
limits:
  max_changed_lines: 200
  exclude_from_line_count:
    - go.sum
rules:
  - profile: go-dependencies
  - name: low-risk-maintenance
    all:
      - name: maintenance-paths
        type: changed_paths_only
        paths: ["*.go", README.md, "docs/**"]
        statuses: [modified, added]
      - name: maintenance-complexity
        type: llm_complexity
        model: gpt-6-sol
        max: low
        max_changed_lines: 100
      - name: maintenance-safety
        type: llm_custom
        model: gpt-6-sol
        max_changed_lines: 100
        prompt: >-
          Require human review for public API or interface-contract changes,
          new externally reachable behavior, or unclear compatibility,
          security, or data-handling effects.
merge:
  method: squash
human_review:
  comment: true
  mention:
    - "@example-org/maintainers"
